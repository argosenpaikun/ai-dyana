[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dyana"
version = "0.1.0"
description = "AI-Dyana - Milvus Vector Database and AI Services"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Mohamed Affian"},
    {name = "Haziq"}
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    
    "websockets",
    "langchain",
    "langchain-anthropic",
    "langgraph",
    "sqlalchemy",
    "librosa",
    "pydantic",
    "aiohttp",
    "openai",
    "pandas",
    "sentence-transformers",
    "pymilvus==3.0.0",
    "torch",
    "pymongo",
    "rank-bm25",
    "redis",

    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-pymongo",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-urllib3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]